<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Extractor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .table-container { margin-top: 30px; overflow-x: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; background: white;}
        .cell-lecture { background-color: #ffffff; }
        .cell-lab { background-color: #e0f2fe; font-weight: 500;}
        .cell-break { background-color: #fef08a; font-style: italic; text-align: center; font-weight: 500;}
        th { white-space: nowrap; background-color: #1e293b !important; color: white !important; }
        td, th { vertical-align: middle; text-align: center; }
        .card { border: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-radius: 12px; }
        .btn-primary { background-color: #4f46e5; border: none; }
        .btn-primary:hover { background-color: #4338ca; }
    </style>
</head>
<body>
    <div class="container mt-5 mb-5">
        <h2 class="mb-4 text-center fw-bold" style="color: #1e293b;">Timetable Extractor Engine</h2>
        <div class="card p-4 mx-auto" style="max-width: 800px;">
            <form id="uploadForm">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Department</label>
                        <input type="text" class="form-control" name="department" placeholder="e.g. CSE" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Year</label>
                        <input type="text" class="form-control" name="year" placeholder="e.g. III" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Section</label>
                        <input type="text" class="form-control" name="section" placeholder="e.g. D" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Upload Timetable (Excel, PDF, Image)</label>
                    <input type="file" class="form-control form-control-lg" name="file" accept=".xlsx,.xls,.xlx,.pdf,.jpg,.jpeg,.png" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg" id="btnExtract">Extract Timetable</button>
                </div>
            </form>
        </div>
        
        <div id="loader" class="text-center mt-5" style="display:none;">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h5 class="mt-3 text-muted">Analyzing structure and extracting contents...</h5>
        </div>

        <div id="verificationScreen" class="mt-5" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0" style="color: #1e293b;">Verification Screen</h3>
                <div>
                    <button class="btn btn-outline-secondary me-2" onclick="editMode()">Edit JSON</button>
                    <button class="btn btn-success" onclick="saveTimetable()">Confirm & Save</button>
                </div>
            </div>
            
            <div class="alert alert-info shadow-sm" id="metaInfo"></div>
            
            <div class="table-responsive table-container p-3">
                <table class="table table-bordered mb-0" id="timetableGrid">
                    <!-- Dynamically generated -->
                </table>
            </div>
            
            <div id="rawJsonContainer" class="mt-5">
                <h5 class="fw-bold">Extracted JSON Structure</h5>
                <pre id="rawJson" class="bg-dark text-light p-3 border rounded shadow-sm" style="max-height: 400px; overflow-y: auto;"></pre>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
